# Einstellungen für den Notion-Abgleich. Hier stehen keine Zugangsdaten:
# Passwörter und der Notion-Schlüssel liegen als GitHub-Secrets im Repo.

# Die Datenbanken des Dashboards „Familie Schneider“ (Data-Source-IDs aus Notion)
notion:
  einkaufsliste: 3b340f99-283b-47b3-9a6a-19a4f3333f0a
  termine: a512dd7d-74d6-46b3-9aab-b7f9f882c8e8
  fixkosten: 5de4b823-e693-4a48-b7e2-a1af4472cfba
  einnahmen: eeeced11-f90c-442a-b286-a236f3c1d507
  sparziele: 80457e73-d5b9-4e32-a6d7-16e74de174ef
  ruecklagen: 0d884531-c9eb-43d0-940e-6517076d85ca
  umsaetze: 22a03619-b40e-4680-9987-36f46b855f17
  finanz_import: c568e2f4-be4e-4fec-99ad-0940767aad1a
  datenquellen: 2b661275-f64a-40d9-b285-00c5a077524f

# Termine so weit im Voraus nach Notion holen
termine_tage: 90

# Wie in der App: Korrekturen für die automatische Erkennung
finanzen:
  # Umsätze mit diesen Begriffen werden ganz ignoriert (z. B. Umbuchungen zwischen eigenen Konten)
  ignorieren:
    - "Umbuchung"
  # Überweisungen mit diesen Begriffen zählen als Rücklage, nicht als Ausgabe.
  # Die Begriffe der einzelnen Sparziele pflegt ihr direkt in Notion (Spalte „Begriffe“).
  ruecklagen_begriffe:
    - "Tagesgeld"
    - "Sparkonto"
  # So heißt die monatliche Kreditkarten-Abbuchung auf dem Girokonto
  # kreditkarten_abbuchung: ["American Express", "AMEX"]
  fixkosten_ausschliessen:
    # - "Amazon"
