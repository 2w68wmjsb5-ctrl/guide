:root{--bg:#14142b;--panel:#1e1e3c;--edge:#07071a;--bevel:#45457a;--text:#f4ecd8;--text-2:#c9c1e0;--accent:#f2c94c;--hp:#e5534b;--xp:#f2c94c;--mp:#4cc2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
body{background:conic-gradient(from 90deg at 2px 2px,transparent 25%,rgb(255 255 255/.015) 0) 0 0/24px 24px,var(--bg);padding:6px}
.panel{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 2px 2px 0 var(--bevel),inset -2px -2px 0 rgb(0 0 0/.35);
 clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
 display:flex;flex-direction:column;min-height:calc(100vh - 12px)}
.cover{border-bottom:3px solid var(--edge);background:#3f86d9}
canvas{display:block;width:100%;image-rendering:pixelated}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;flex:1}
.hello{font-family:"Pixel";font-size:15px;color:var(--text-2);text-align:center}
.clock{display:grid;justify-items:center;text-align:center;padding:8px 0 12px;background:var(--edge)}
.phase{font-family:"Pixel";font-size:14px;color:var(--accent)}
.time{font-family:"VT";font-size:clamp(40px,14vw,64px);line-height:1.05;letter-spacing:.04em;color:#9dffb0;text-shadow:0 0 8px rgb(157 255 176/.35)}
.date{font-size:12px;color:var(--text-2)}
.prog{display:grid;gap:10px}
.lbl{display:flex;justify-content:space-between;font-family:"Pixel";font-size:13px;margin-bottom:3px}
.lbl span:last-child{font-family:"VT";font-size:17px;line-height:1}

.box span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--fill) 0 8px,color-mix(in srgb,var(--fill) 70%,black) 8px 10px);box-shadow:inset 0 3px 0 rgb(255 255 255/.3)}
.hp{--fill:var(--hp)}.xp{--fill:var(--xp)}.mp{--fill:var(--mp)}

<script>// Pixel-game graphics: a village scene for the cover (sky follows the time
const Pixel = (() => {
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const c = [16, 8, 0].map((s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t));
    return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
  }

  function rect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }
  function sprite(ctx, rows, colors, x, y, flip = false) {
    rows.forEach((row, dy) => [...row].forEach((ch, dx) => {
      const c = colors[ch];
      if (!c) return;
      rect(ctx, x + (flip ? row.length - 1 - dx : dx), y + dy, 1, 1, c);
    }));
  }

  function gradient(ctx, w, h, stops) {
    for (let y = 0; y < h; y++) {
      const t = (y / (h - 1)) * (stops.length - 1), i = Math.min(Math.floor(t), stops.length - 2);
      rect(ctx, 0, y, w, 1, mix(stops[i], stops[i + 1], t - i));
    }
  }

    if (hour >= 17 && hour < 21) return "evening";
    return "night";
  }

  function tree(ctx, x, ground, size, r, dark) {
    const leaf = dark ? ["#1d4a2e", "#2a6a3a", "#3a7f45"] : ["#2f7a3b", "#46a04a", "#7cc95a"];
    rect(ctx, x - 1, ground - size * 0.6, 3, size * 0.6, dark ? "#3b2a22" : "#6b4428");
    const cy = ground - size * 0.75;
    for (let y = -size / 2; y <= size / 2; y++) {
      for (let dx = -size / 2; dx <= size / 2; dx++) {
        const d = (dx * dx + y * y * 1.3) / ((size / 2) ** 2);
        if (d > 1 + (r() - 0.5) * 0.2) continue;
        const shade = y < -size / 6 && dx < size / 6 ? 2 : d > 0.6 || y > size / 5 ? 0 : 1;
        rect(ctx, x + dx, cy + y, 1, 1, leaf[shade]);
      }
    }
  }

  function house(ctx, x, ground, night) {
    const w = 30, wallH = 15;
    const top = ground - wallH;
    rect(ctx, x + 21, top - 13, 4, 8, "#7a4b3a");
    rect(ctx, x + 20, top - 14, 6, 2, "#5a3328");
    for (let i = 0; i < 12; i++) {
      const y = top - 12 + i, inset = 12 - i;
      rect(ctx, x - 2 + inset, y, w + 4 - inset * 2, 1, i % 3 === 2 ? "#9c3b34" : "#c4524a");
    }
    rect(ctx, x - 3, top - 1, w + 6, 1, "#7d2e29");
    rect(ctx, x, top, w, wallH, "#f1dfbf");
    for (let y = top + 3; y < ground; y += 4) rect(ctx, x, y, w, 1, "#dcc49e");
    rect(ctx, x + w - 2, top, 2, wallH, "#d4b88f");
    rect(ctx, x + 12, ground - 9, 6, 9, "#6b3f24");
    rect(ctx, x + 13, ground - 8, 4, 8, "#8a5530");
    rect(ctx, x + 16, ground - 5, 1, 1, "#f2c94c");
    for (const wx of [x + 3, x + 21]) {
      rect(ctx, wx, top + 3, 6, 6, "#5a3a26");
      rect(ctx, wx + 1, top + 4, 4, 4, night ? "#ffd66e" : "#8fd0ff");
      rect(ctx, wx + 3, top + 4, 1, 4, "#5a3a26");
      rect(ctx, wx + 1, top + 6, 4, 1, "#5a3a26");
      rect(ctx, wx, top + 9, 6, 1, "#7a4f33");
      rect(ctx, wx + 1, top + 10, 1, 1, "#ef7aa8");
      rect(ctx, wx + 4, top + 10, 1, 1, "#f2c94c");
    }
    if (night) {
      ctx.globalAlpha = 0.18;
      rect(ctx, x + 1, top + 2, 10, 10, "#ffd66e");
      rect(ctx, x + 19, top + 2, 10, 10, "#ffd66e");
      ctx.globalAlpha = 1;
    }
  }

  function cover(canvas, hour, seed = 4) {
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height, r = rng(seed);
    const s = SKIES[phase(hour)];
    const ground = h - 11, cx = Math.floor(w / 2);
    gradient(ctx, w, ground, s.sky);

    if (s.night) {
      for (let i = 0; i < w / 3; i++) {
        ctx.globalAlpha = 0.4 + r() * 0.6;
        rect(ctx, r() * w, r() * ground * 0.7, 1, 1, "#ffffff");
      }
      ctx.globalAlpha = 1;
      sprite(ctx, [".mmm.", "mmm..", "mm...", "mmm..", ".mmm."], { m: "#f4f1d0" }, cx + 70, 6);
    } else {
      const sunX = phase(hour) === "morning" ? cx - 90 : phase(hour) === "evening" ? cx + 95 : cx + 60;
      for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) {
        if (x * x + y * y <= 17) rect(ctx, sunX + x, 10 + y, 1, 1, s.light);
      }
      for (let i = 0; i < 6; i++) {
        const x = r() * w, y = 4 + r() * 14, len = 8 + Math.floor(r() * 10);
        rect(ctx, x, y, len, 2, "#ffffff");
        rect(ctx, x + 2, y - 1, len - 5, 1, "#ffffff");
        rect(ctx, x + 1, y + 2, len - 2, 1, mix("#ffffff", s.sky[1], 0.4));
      }
      for (let i = 0; i < 3; i++) {
        const x = cx - 40 + i * 9 + r() * 4, y = 8 + r() * 6;
        rect(ctx, x, y, 1, 1, "#2b2b3a"); rect(ctx, x + 1, y + 1, 1, 1, "#2b2b3a"); rect(ctx, x + 2, y, 1, 1, "#2b2b3a");
      }
    }
    s.hills.forEach((color, i) => {
      const base = ground - (i ? 6 : 14), amp = i ? 4 : 6, freq = i ? 0.05 : 0.03;
      for (let x = 0; x < w; x++) {
        const y = Math.round(base - amp * Math.sin(x * freq + i * 2 + seed));
        rect(ctx, x, y, 1, ground - y, color);
      }
    });
    for (const [dx, size] of [[-150, 13], [-118, 10], [-64, 15], [52, 12], [104, 16], [146, 11]]) {
      tree(ctx, cx + dx, ground, size, r, s.night);
    }
    house(ctx, cx - 15, ground, s.night);
    for (let x = cx - 60; x < cx - 22; x += 4) rect(ctx, x, ground - 5, 1, 5, "#8a5a34");
    rect(ctx, cx - 60, ground - 4, 38, 1, "#a8703f");
    rect(ctx, cx - 60, ground - 2, 38, 1, "#a8703f");
    rect(ctx, 0, ground, w, h - ground, "#7a5232");
    rect(ctx, 0, ground, w, 2, s.night ? "#2f5e33" : "#5cb84f");
    rect(ctx, 0, ground + 2, w, 1, s.night ? "#244a29" : "#3f9443");
    for (let i = 0; i < w / 3; i++) rect(ctx, r() * w, ground + 4 + r() * (h - ground - 4), 1, 1, r() < 0.5 ? "#5e3d24" : "#94693f");
    rect(ctx, cx - 3, ground, 6, h - ground, "#c9a46b");
    for (let i = 0; i < w / 5; i++) {
      const x = r() * w;
      if (Math.abs(x - cx) < 6) continue;
      rect(ctx, x, ground - 1, 1, 1, s.night ? "#3f7a43" : "#7cd25d");
      if (r() < 0.25) rect(ctx, x, ground - 2, 1, 1, ["#ef7aa8", "#f2c94c", "#ffffff"][Math.floor(r() * 3)]);
    }
    sprite(ctx, PERSON_A, { h: "#4a2e1f", s: "#f2c39b", e: "#2b2b3a", c: "#3f7fd6", p: "#36405e", b: "#2b2b3a" }, cx + 22, ground - 11);
    sprite(ctx, PERSON_B, { h: "#c2702f", s: "#f2c39b", e: "#2b2b3a", c: "#d65f8a", b: "#2b2b3a" }, cx + 30, ground - 11, true);
    sprite(ctx, HEART, { r: "#e5534b", w: "#ffb3ad" }, cx + 26, ground - 20);
    sprite(ctx, CAT, { k: "#3a3a46", e: "#f2c94c" }, cx - 34, ground - 5);

    if (s.night) {
      for (let i = 0; i < 10; i++) {
        ctx.globalAlpha = 0.5 + r() * 0.5;
        rect(ctx, r() * w, ground - 4 - r() * 20, 1, 1, "#d8ff8a");
      }
      ctx.globalAlpha = 1;
    }
  }

  const SCENES = {}; function scene() {}
  return { cover, phase };
})();
</script>
<script>
const $=id=>document.getElementById(id);
const LABEL={morning:"☼ Morgen",day:"☀ Tag",evening:"☾ Abend",night:"★ Nacht"};
let last=null;
function bars(now){
 const y0=new Date(now.getFullYear(),0,1),y1=new Date(now.getFullYear()+1,0,1);
 const m0=new Date(now.getFullYear(),now.getMonth(),1),m1=new Date(now.getFullYear(),now.getMonth()+1,1);
 const w0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)),w1=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7);
 const p=(a,b)=>Math.round((now-a)/(b-a)*100);
 $("prog").innerHTML=[["Jahr",p(y0,y1),"hp"],["Monat",p(m0,m1),"xp"],["Woche",p(w0,w1),"mp"]]
  .map(([l,v,k])=>`<div><div class="lbl"><span>${l}</span><span>${v}%</span></div><div class="box ${k}"><span style="width:${v}%"></span></div></div>`).join("");
}
function tick(){
 const now=new Date(),h=now.getHours(),ph=Pixel.phase(h);
 if(ph!==last){last=ph;const c=$("cover");c.getContext("2d").clearRect(0,0,c.width,c.height);Pixel.cover(c,h);}
 $("phase").textContent=LABEL[ph];
 $("time").textContent=now.toLocaleTimeString("de-DE");
 $("date").textContent=now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
 $("hello").textContent=(h<11?"Guten Morgen":h<18?"Hallo":"Guten Abend")+", Familie Schneider!";
 if(now.getSeconds()===0||!$("prog").childElementCount)bars(now);
}
tick();setInterval(tick,1000);
</script></body></html>
